    function buildMissionData() {
      return {
        kpis: TEMPLATE_2569.map(k => {
          const raw = EXCEL_MISSION[k.code] || EXCEL_MISSION[k.code.replace(/a|b$/,'')];
          const normalize = (qd, qkey) => {
            if (!qd) return {result:'',percent:'',detail:'',link:''};
            const r = (!qd.result || qd.result==='None') ? '' : qd.result;
            const p = (!qd.percent || qd.percent==='None') ? '' : qd.percent;
            return {result:r, percent:p, detail:qd.detail||'', link: LINKS[k.code]?.[qkey]||''};
          };
          const q2 = normalize(raw?.Q2, 'Q2');
          const q3 = normalize(raw?.Q3, 'Q3');
          return {...k, quarters:{Q1:{...q2}, Q2:q2, Q3:q3, Q4:{result:'',percent:'',detail:'',link:''}}};
        })
      };
    }

    function buildProactiveData() {
      return {
        kpis: PRO_TEMPLATE.map(k => {
          const raw = EXCEL_PROACTIVE[k.code];
          const q = raw ? {score:raw.score, percent:raw.percent, detail:raw.detail, owner:raw.owner, link:''} : {score:'',percent:'',detail:'',owner:'',link:''};
          const empty = {score:'',percent:'',detail:'',owner:'',link:''};
          return {...k, quarters:{Q1:{...q}, Q2:{...q}, Q3:{...q}, Q4:{...empty}}};
        })
      };
    }
